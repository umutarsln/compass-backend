# Railway deploy ayarları — shawk-ecommerce-backend (NestJS)
# https://docs.railway.com/reference/config-as-code

[build]
builder = "NIXPACKS"
# Nixpacks zaten npm ci çalıştırır; tekrar npm ci EBUSY (node_modules/.cache) hatasına yol açar.
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start:prod"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
